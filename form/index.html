<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="form.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Form</title>
</head>

<body>
    <section class="hero">
        <img src="view-overlay.jpg" class="photo" alt="phone view">
        <h1><br>GOT MARKETING?<br>ADVANCE YOUR BUSINESS INSIGHT.</h1>
        <p>Fill out the form and receive our award winning newsletter.</p>
    </section>

    <div class="form-container">
        <form action="/submit-form" method="POST" class="newsletter-form">

            <div class="form-group">
                <label for="name">Name:
                    <input type="text" id="name" name="name" autocomplete="given-name">
                </label>
            </div>
            <div class="form-group">
                <label for="email">Email:
                    <input type="text" id="email" name="email">
                </label>
            </div>
            <button type="submit" class="submit-btn">Sign me up</button>

        </form>
    </div>
</body>

</html>
